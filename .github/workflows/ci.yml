name: CI

# Runs on every PR targeting main and on every push to main (post-merge validation), plus manual
# dispatch. CI only — no deploy/publish steps.
#
# The suite is split into concurrent, independently-reported checks: a `changes` job detects which
# test modules a PR touched (path-based skipping), a dynamic `test` matrix runs one job per affected
# module (each mirrors a src/app/game/<group> folder — see jest.config.js `projects`), a
# `coverage-gate` merges every module's coverage and enforces the global threshold, and `ci-success`
# is the single stable aggregate check. Point branch protection's required check at `ci-success`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which test modules this change affects. `shared` (foundational code imported everywhere)
  # fans out to ALL modules — the sim is tightly coupled, so a change to types/util/json/the tick
  # spine/root orchestrators must run everything. Otherwise a module runs when its own
  # src/app/game/<group>/ or test/<module>/ changed. Output `modules` is a JSON array consumed by the
  # dynamic test matrix.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          MODULES="world agents population events actions execution economy skills objects history save data util"

          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="$PR_BASE_SHA"; else BASE="$PUSH_BEFORE_SHA"; fi
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          echo "changed files:"; echo "$CHANGED"

          # Shared foundations → run EVERY module's tests. This is a correctness net, not laziness: these
          # are imported by / affect the compilation of every module, so a change here can break any
          # module's tests. It is deliberately limited to things that change TEST OUTCOMES — shared source
          # (types/util/json, the execution spine, the root orchestrators GameManager/City/Clock) and the
          # test toolchain config (package(-lock), tsconfig, jest.config, babel). It does NOT include CI
          # workflow files, scripts/, lint config, or docs — changing those can't change a module test's
          # result, so a PR touching only those (like a docs/CI-config change) runs NO module tests.
          SHARED_RE='^(src/types/|src/util/|src/json/|src/app/game/execution/|src/app/game/GameManager\.ts|src/app/game/City\.ts|src/app/game/Clock\.ts|package\.json|package-lock\.json|tsconfig\.json|jest\.config\.js|\.babelrc|babel\.config\.js)'

          SELECTED=""
          if echo "$CHANGED" | grep -qE "$SHARED_RE"; then
            SELECTED="$MODULES"
          else
            for m in $MODULES; do
              # util's source lives in the shared src/util (handled above); trigger it only on its tests.
              if [ "$m" = "util" ]; then
                echo "$CHANGED" | grep -qE "^test/util/" && SELECTED="$SELECTED $m" || true
              else
                echo "$CHANGED" | grep -qE "^(src/app/game/$m/|test/$m/)" && SELECTED="$SELECTED $m" || true
              fi
            done
          fi

          # Emit a JSON array (empty array when nothing test-relevant changed → the test job is skipped).
          # Use jq to drop blanks + dedupe — NOT `grep -v '^$'`, which exits 1 when SELECTED is empty
          # (e.g. a docs-only PR) and, under `set -o pipefail`, would fail the whole step.
          JSON=$(printf '%s\n' $SELECTED | jq -R 'select(length > 0)' | jq -cs 'unique')
          echo "selected modules: $JSON"
          echo "modules=$JSON" >> "$GITHUB_OUTPUT"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build-prod

  # Broad "lint & problems" check — reproduces the VS Code Problems panel (ESLint for TS/React/import
  # hygiene, markdownlint for docs). Both linters run even if the first fails, so all problems surface.
  # The backlog is cleared, so this is BLOCKING (in `ci-success`'s needs) — keep it green.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Markdown lint
        run: npm run lint:md
      - name: ESLint
        if: always()
        run: npm run lint:js

  # Unit perf-regression gates for the offline generation spine (the `perf` jest project). Runs on EVERY change
  # — a per-agent / subcomponent perf regression can originate anywhere in the sim — with --runInBand and NO
  # coverage (istanbul instrumentation would skew the one timing check). Well under 10s. The gate is
  # DETERMINISTIC OPERATION COUNTS (util/perfMeter): the sim does identical work per fixed seed on every machine,
  # so the counts are byte-identical everywhere and are asserted EXACTLY against test/perf/baselines.json — no
  # drift tolerance, no machine-class caveat, no PERF_ENFORCE flag (it enforces the same on a dev box and here).
  # A count moves only when the sim's work moves, which forces a conscious re-baseline. generationPerf covers
  # the whole spine (the sum of parts); regressionGuards pins the specific 078/079 wins (invoke agent-list = 0
  # scanned, cache-miss counts, instance pruning) plus the ONE exception counts can't see — predicate
  # precompilation — via a within-run timing RATIO (still machine-independent). BLOCKING (in ci-success needs).
  # Re-baseline after an intentional perf change: PERF_UPDATE_BASELINES=1 npx jest --selectProjects perf, commit
  # baselines.json (deterministic, so a local box suffices — CI will match).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generation perf-regression gates
        run: npx jest --selectProjects perf --runInBand

  # One concurrent job per test module — fast, granular pass/fail; each runs its module's jest project
  # with --coverage and uploads its own per-module report for the `coverage` job to gate. Shared steps
  # live in the reusable ./.github/workflows/test-module.yml; here we have one caller per module, each
  # gated by a per-module `if` so modules this PR did NOT affect show up as SKIPPED in the checks list
  # (not merely absent). `changes` decides which are affected (see that job). A static matrix can't do
  # this — `matrix` isn't available in a job-level `if` — so keep this list in sync with `changes`.
  test-world:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'world') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: world }
  test-agents:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'agents') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: agents }
  test-population:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'population') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: population }
  test-events:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'events') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: events }
  test-actions:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'actions') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: actions }
  test-execution:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'execution') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: execution }
  test-economy:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'economy') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: economy }
  test-skills:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'skills') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: skills }
  test-objects:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'objects') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: objects }
  test-history:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'history') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: history }
  test-save:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'save') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: save }
  test-data:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'data') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: data }
  test-util:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.modules), 'util') }}
    uses: ./.github/workflows/test-module.yml
    with: { module: util }

  # Coverage gate: does NOT run tests — it downloads every module's report from the `test` jobs and
  # fails if ANY module's OWNED-file statement coverage is below COVERAGE_THRESHOLD (jest.config.js,
  # currently 80%). scripts/coverage-gate.mjs filters each report to the module's own files first —
  # Jest's collectCoverageFrom is additive, so an unfiltered report is diluted by transitively-required
  # files from other modules. All modules currently clear 80%, so this is BLOCKING (in ci-success's needs).
  coverage:
    needs: [changes, test-world, test-agents, test-population, test-events, test-actions, test-execution, test-economy, test-skills, test-objects, test-history, test-save, test-data, test-util]
    if: always() && needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Download module coverage reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: coverage-*
        continue-on-error: true
      - name: Per-module coverage gate
        run: node scripts/coverage-gate.mjs coverage-artifacts

  # Advisory — surfaces known vulnerabilities without blocking the merge. `--omit=dev` gates only the
  # dependencies that actually SHIP: dev-only tooling (browser-sync's transitive ws/socket.io) carries
  # advisories that never reach the bundle. Run a plain `npm audit` locally for the full dev picture.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  # Single stable aggregate check — make THIS the required status check in branch protection. Fails if
  # any required upstream job failed or was cancelled (skipped is fine). `audit` is intentionally NOT
  # here (advisory — dev-tooling advisories shouldn't block).
  ci-success:
    needs: [changes, typecheck, build, lint, perf, coverage, test-world, test-agents, test-population, test-events, test-actions, test-execution, test-economy, test-skills, test-objects, test-history, test-save, test-data, test-util]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no required job failed
        # join(needs.*.result) = the results of every job listed in `needs` (audit is excluded — advisory).
        # skipped is fine (an unaffected module / a skipped coverage gate); only failure/cancelled block.
        run: |
          set -eu
          echo "results: ${{ join(needs.*.result, ' ') }}"
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not succeed (result: $r)"; exit 1
            fi
          done
          echo "All required jobs succeeded."

  # Playwright integration suite (task 008) — boots the real PRODUCTION build (React HUD + Phaser canvas) and
  # drives it through the window.__townbox determinism hook. It is SLOW (a real browser running the sim over
  # many ticks) and ASYNC: like `audit`, it is deliberately NOT in `ci-success`'s `needs`, so it never blocks a
  # merge. Its result is visible on the PR; when the suite is mature and stable, a follow-up can promote it into
  # `ci-success` (or its own required check). The playwright.config webServer builds+serves ./bin, so no separate
  # build step is needed. COVERAGE=1 collects the scene/HUD browser-coverage artifact (§7, informational).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run integration suite (with browser coverage)
        run: npm run test:integration:coverage
      - name: Upload Playwright HTML report + traces/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload scene/HUD browser-coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: coverage-integration/
          retention-days: 14
